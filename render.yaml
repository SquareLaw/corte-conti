services:
  - type: web
    name: corteconti-diagnostic
    env: python
    plan: free
    # Render's free tier is 512MB RAM. Headless Chromium alone typically
    # needs 400MB+, so this is genuinely tight - fine to TEST since this
    # diagnostic only loads one page once per request, but if this OOMs
    # (check the Logs tab for "Out of memory" / a sudden restart), that's
    # the signal to move to Google Cloud Run instead, whose free tier
    # allows configuring 1GB RAM - a better fit for browser automation
    # than Render's free plan.
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
